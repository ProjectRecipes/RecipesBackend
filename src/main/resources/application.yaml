server:
  port: 8080

spring:
  application:
    name: ProjectRecipesBackend
  datasource:
    url: jdbc:postgresql://localhost:5432/RecipesDataBase
    username: postgres
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET:promeni-ovo-u-dugacak-tajni-kljuc-od-bar-32-karaktera}
    expiration-ms: 86400000
  upload-dir: uploads
  frontend-url: http://localhost:4200